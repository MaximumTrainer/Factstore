id: service-frontend
name: Frontend Application
description: >-
  Baseline gates for a browser-delivered application. Third-party licence exposure and
  accessibility matter here in a way they do not for a backend service; there is usually no
  container image to scan.
category: service-type
serviceType: frontend
framework: house-standard
version: "1.0"
trail:
  attestations:
    - name: unit-tests
      type: junit
    - name: sast
      type: ghas
    - name: dependency-scan
      type: snyk
    - name: licence-scan
      type: licence-scan
    - name: accessibility-check
      type: accessibility
