spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:factstore}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  flyway:
    enabled: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: classpath:graphql/
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # GitHub OAuth2 Social Login (Web UI)
  # To enable GitHub login, set these environment variables and uncomment the block:
  #   GITHUB_CLIENT_ID=<your-github-oauth-app-client-id>
  #   GITHUB_CLIENT_SECRET=<your-github-oauth-app-client-secret>
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         github:
  #           client-id: ${GITHUB_CLIENT_ID}
  #           client-secret: ${GITHUB_CLIENT_SECRET}
  #           scope: read:user,user:email

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Factstore API
    version: v1

ledger:
  enabled: ${LEDGER_ENABLED:false}
  type: ${LEDGER_TYPE:local}
  qldb:
    ledger-name: ${QLDB_LEDGER_NAME:factstore-ledger}
    region: ${AWS_REGION:us-east-1}
  local:
    storage-path: ${LEDGER_STORAGE_PATH:./data/ledger}

audit:
  hmac-secret: ${AUDIT_HMAC_SECRET:change-me-in-production}
sso:
  jwt:
    # Secret used to sign Factstore JWTs issued after successful SSO login.
    # Override with a strong random value in production via the SSO_JWT_SECRET environment variable.
    secret: ${SSO_JWT_SECRET:changeme-in-production}
    expiry-hours: ${SSO_JWT_EXPIRY_HOURS:8}
vault:
  enabled: ${VAULT_ENABLED:false}
  uri: ${VAULT_ADDR:http://localhost:8200}
  authentication: ${VAULT_AUTH_METHOD:TOKEN}
  token: ${VAULT_TOKEN:}
  app-role:
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
  kv:
    enabled: true
    backend: secret
    default-context: factstore
  tls:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    rabbit:
      # Disable the RabbitMQ health indicator so /actuator/health returns UP even when
      # no broker is present (e.g. single-node deployments where events.publisher=logging).
      enabled: false

server:
  port: 8080
  # HTTPS / TLS configuration (production)
  # Uncomment and configure the block below to enforce HTTPS:
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEY_STORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: factstore

opa:
  mode: ${OPA_MODE:embedded}
  external-url: ${OPA_URL:http://localhost:8181}

factstore:
  events:
    publisher: ${FACTSTORE_EVENTS_PUBLISHER:logging}
  region: ${FACTSTORE_REGION:us-east-1}
  policy:
    evaluator: ${FACTSTORE_POLICY_EVALUATOR:opa}
  scm:
    encryption-key: ${SCM_ENCRYPTION_KEY:default-dev-key-32chars!!!!!!}

cosign:
  enabled: ${COSIGN_ENABLED:false}

# Set SECURITY_ENFORCE_AUTH=true in production to enforce authentication
security:
  enforce-auth: ${SECURITY_ENFORCE_AUTH:false}
  # Log what would have been rejected, without rejecting it. The way to find every
  # unauthenticated caller before turning enforcement on (#155 rollout step 2).
  warn-mode: ${SECURITY_WARN_MODE:false}

  api-key:
    # A key that never expires outlives the pipeline, the project and the person who made it.
    max-ttl-days: ${API_KEY_MAX_TTL_DAYS:90}
    default-ttl-days: ${API_KEY_DEFAULT_TTL_DAYS:90}
    allow-non-expiring: ${API_KEY_ALLOW_NON_EXPIRING:false}
    # How long a rotated key keeps working, so a pipeline can roll over without an outage.
    rotation-overlap-hours: ${API_KEY_ROTATION_OVERLAP_HOURS:24}
    expiry-warning-days: ${API_KEY_EXPIRY_WARNING_DAYS:7}
    # Bounds how long a revocation can go unnoticed; revoking invalidates immediately anyway.
    cache-ttl-seconds: ${API_KEY_CACHE_TTL_SECONDS:60}
    rate-limit:
      enabled: ${API_KEY_RATE_LIMIT_ENABLED:true}
      max-failures: ${API_KEY_RATE_LIMIT_MAX_FAILURES:5}
      base-backoff-seconds: 2
      max-backoff-seconds: 300

  session:
    lifetime-seconds: ${SESSION_LIFETIME_SECONDS:3600}
    absolute-lifetime-seconds: ${SESSION_ABSOLUTE_LIFETIME_SECONDS:43200}
    idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT_SECONDS:1800}

  bootstrap:
    # A fresh deployment with enforcement on must be administrable; see docs/api-authorisation.md.
    enabled: ${SECURITY_BOOTSTRAP_ENABLED:true}
    admin-email: ${SECURITY_BOOTSTRAP_ADMIN_EMAIL:admin@localhost}
    ttl-days: ${SECURITY_BOOTSTRAP_TTL_DAYS:7}

  cors:
    # Deny by default. A wildcard is refused outright when enforcement is on.
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}

